<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View DRT Adhocs">
    <meta name="keywords" content="DRT, Adhocs, management">
    <title>View Adhocs</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #filterForm {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        #filterForm label {
            margin-right: 5px;
        }

        #filterForm input {
            margin-right: 10px;
            padding: 5px;
        }

        .date-filters {
            display: flex;
            align-items: center;
            margin-right: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="index.html">DRT Productivity tool</a></h1>
    </header>
    <main>
        <h2>Filter Adhocs</h2>
        <form id="filterForm">
            <div class="date-filters">
                <label for="startDate">Start Date:</label>
                <input type="date" id="startDate" name="startDate">

                <label for="endDate">End Date:</label>
                <input type="date" id="endDate" name="endDate">
            </div>
            <button type="submit">Filter</button>
        </form>

        <table id="adhocsTable">
            <thead>
                <tr>
                    <th>Login ID</th>
                    <th>Adhoc1 (Activity - Time)</th>
                    <th>Adhoc2 (Activity - Time)</th>
                    <th>Adhoc3 (Activity - Time)</th>
                    <th>Adhoc4</th>
                    <th>Adhoc5</th>
                    <th>Adhoc6</th>
                    <th>Total Adhoc Minutes</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be inserted dynamically -->
            </tbody>
        </table>
        <button id="downloadBtn">Download CSV</button>
    </main>
    <footer>
        <p>&copy; Designed by Murali Krishna.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
