<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View DRT Adhocs">
    <meta name="keywords" content="DRT, Adhocs, management">
    <title>View Adhocs</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Styles for the filter form */
        #filterForm {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        #filterForm label {
            margin-right: 5px;
        }

        #filterForm input {
            margin-right: 10px;
            padding: 5px;
        }

        /* Styles to align the date inputs side by side */
        .date-filters {
            display: flex;
            align-items: center;
            margin-right: 20px; /* Add space between filters and button */
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="index.html">DRT Adhocs</a></h1>
    </header>
    <main>
        <h2>Filter Adhocs</h2>
        <form id="filterForm">
            <div class="date-filters">
                <label for="startDate">Start Date:</label>
                <input type="date" id="startDate" name="startDate">

                <label for="endDate">End Date:</label>
                <input type="date" id="endDate" name="endDate">
            </div>
            <button type="submit">Filter</button>
        </form>

        <table id="adhocsTable">
            <thead>
                <tr>
                    <th>Login ID</th>
                    <th>Adhoc Activity</th>
                    <th>Duration (mins)</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                <!-- Adhocs will be dynamically inserted here -->
            </tbody>
        </table>
        <button id="downloadBtn">Download CSV</button>
    </main>
    <footer>
        <p>&copy; Designed by Murali Krishna.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
