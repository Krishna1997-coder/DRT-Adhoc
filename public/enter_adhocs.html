<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Enter DRT Adhocs">
    <meta name="keywords" content="DRT, Adhocs, management">
    <title>Enter Adhocs</title>

</head>
<body>
    <header>
        <h1><a href="index.html">DRT Adhocs</a></h1>
    </header>
    <main>
        <form id="adhocForm">
            <input type="text" id="loginId" placeholder="Login ID" required>
            <input type="text" id="adhocActivity" placeholder="Adhoc Activity" required>
            <input type="text" id="duration" placeholder="Duration (mins)" required>
            <input type="date" id="date" required>
            <button type="submit">Submit</button>
        </form>
