<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Enter DRT Adhocs">
    <meta name="keywords" content="DRT, Adhocs, management">
    <title>Enter Adhocs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1><a href="index.html">DRT Productivity tool</a></h1>
    </header>
    <main>
        <form id="adhocForm">
            <select id="loginId" required>
                <option value="">Select Login ID</option>
                <option value="carmonsh">carmonsh</option>
                <option value="chnilotp">chnilotp</option>
                <option value="cristopy">cristopy</option>
                <option value="dahernab">dahernab</option>
                <option value="djerrren">djerrren</option>
                <option value="garcjull">garcjull</option>
                <option value="gkoteddi">gkoteddi</option>
                <option value="hlasrado">hlasrado</option>
                <option value="jreyesh">jreyesh</option>
                <option value="kevjimed">kevjimed</option>
                <option value="kumarqab">kumarqab</option>
                <option value="lmuralik">lmuralik</option>
                <option value="maltezel">maltezel</option>
                <option value="mddeepk">mddeepk</option>
                <option value="mdniz">mdniz</option>
                <option value="melaaray">melaaray</option>
                <option value="msnandhu">msnandhu</option>
                <option value="mugdhakj">mugdhakj</option>
                <option value="panugah">panugah</option>
                <option value="ptimp">ptimp</option>
                <option value="shaikyas">shaikyas</option>
                <option value="shobhpap">shobhpap</option>
                <option value="shsudhak">shsudhak</option>
                <option value="singhhqo">singhhqo</option>
                <option value="srivaesu">srivaesu</option>
                <option value="tippirer">tippirer</option>
                <option value="ukamsuma">ukamsuma</option>
                <option value="vodelm">vodelm</option>
                <option value="ycharanu">ycharanu</option>
                <option value="chitianu">chitianu</option>
                <option value="najuverk">najuverk</option>
            </select>
            
            <label for="adhocActivity"></label>
            <select id="adhocActivity" name="adhocActivity" required>
                <option value="">Select Activity</option>
                <option value="Ops Calibration Connect">Ops Calibration Connect</option>
                <option value="OSE Calibration Connect">OSE Calibration Connect</option>
                <option value="Data Analysis">Data Analysis</option>
                <option value="FFR Quip Update">FFR Quip Update</option>
                <option value="Revalidation Audit Count">Revalidation Audit Count</option>
                <option value="Revalidation Sorting & Allocation">Revalidation Sorting & Allocation</option>
                <option value="Others">Others</option>
            </select>

            <div id="countContainer" style="display:none;">
                <input type="number" id="count" placeholder="Count">
            </div>

            <div id="otherActivityContainer" style="display:none;">
                <input type="text" id="otherActivity" placeholder="Activity Name">
            </div>
            
            <input type="text" id="duration" placeholder="Duration (mins)" required disabled> <!-- Disabled by default -->
            <input type="date" id="date" required>
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <p>&copy; Designed by Murali Krishna.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
